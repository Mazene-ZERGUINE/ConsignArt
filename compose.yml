services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: art-api-dev
    environment:
      NODE_ENV: development
      SERVER_PORT: ${SERVER_PORT:-3000}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_DEBUG_MODE: ${SERVER_DEBUG_MODE:-true}
      DB_DRIVER: sqlite
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: dev
      DB_PASSWORD: dev
      DB_DATABASE: /app/data/app.sqlite
      DB_SYNCHRONIZE: 'true'
      DB_DEBUG_MODE: 'false'
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-insecure-refresh-secret-change-me}
    ports:
      - '${SERVER_PORT:-3000}:${SERVER_PORT:-3000}'
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json
      - /app/node_modules
      - ./data:/app/data
      - ./logs:/app/logs
    command: sh -c "npm run seed && npm run start:dev"
    restart: unless-stopped
